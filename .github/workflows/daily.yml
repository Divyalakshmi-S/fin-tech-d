name: Daily Finance Bot

on:
  schedule:
    - cron: '0 4 * * 1-6'  # 9:30 AM IST (UTC+5:30) — daily bot (Mon-Sat)
    - cron: '0 4 * * 0'    # 9:30 AM IST every Sunday — weekly email + daily bot
  workflow_dispatch:  # manual trigger

jobs:
  daily-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH: ${{ secrets.TWILIO_AUTH }}
          TO_NUMBER: ${{ secrets.TO_NUMBER }}
          TO_NUMBER_2: ${{ secrets.TO_NUMBER_2 }}
        run: python bot.py

  weekly-email:
    if: github.event.schedule == '0 4 * * 0'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weekly email
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python weekly_email.py
